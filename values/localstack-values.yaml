# Enforce the v4.x container engine explicitly
image:
  repository: localstack/localstack
  tag: "4.0.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

persistence:
  enabled: true
  size: 10Gi

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

extraEnvVars:
  # Required by Helm chart 0.7.0+ (Pass your token, or a mock value if using community tier)
  - name: LOCALSTACK_AUTH_TOKEN
    value: "mock-auth-token-value"

  # Optional log verbosity toggle
  - name: DEBUG
    value: "1"

  # Note: The old 'SERVICES' variable is removed because LocalStack v4.x 
  # automatically lazy-loads all APIs on-demand when called!
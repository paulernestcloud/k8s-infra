apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: localstack
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: localstack

  sources:
    # 1. The Official Helm Chart Repo targeted to the latest 0.7.0 structure
    - repoURL: https://localstack.github.io/helm-charts
      chart: localstack
      targetRevision: 0.7.0
      helm:
        valueFiles:
          - $values/values/localstack-values.yaml

    # 2. Your dedicated GitOps Repo containing your values directory overrides
    - repoURL: https://github.com/paulernestcloud/terraform-aws-3tier-webapp
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xenith
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:paulernestcloud/xenithevent.ae.git
    targetRevision: HEAD
    path: k8s/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: xenith

  syncPolicy:
    automated:
      prune: true
      selfHeal: true